name: feedback_fractal2_mess3
# mess3 <-> fractal2 feedback loop, fractal2 as the non-delayed factor:
#   T = fractal2 (V=2, S=2)
#   U = mess3 (V=3, S=3, action-delayed -> S*X = 9)
# Wiring: T K = V_u = 3 -> 3 fractal2 variants; U K = V_t = 2.
# Joint vocab 2*3 = 6 (+BOS). Factored bound (2-1)+(9-1) = 8; joint 2*9-1 = 17.
# All fractal2 kernels use p == q (doubly stochastic -> the uniform initial
# latent is the true stationary distribution; see the paper's process appendix).
instance:
  _target_: fwh_core.generative_processes.feedback_transducer.build_feedback_transducer_process_from_spec
  noise_epsilon: 0.0
  factors:
    - role: T
      transducer:
        from_hmms:
          - {process_name: fractal2, process_params: {b: 0.25, p: 0.25, q: 0.25}}
          - {process_name: fractal2, process_params: {b: 0.50, p: 0.35, q: 0.35}}
          - {process_name: fractal2, process_params: {b: 0.75, p: 0.65, q: 0.65}}
    - role: U
      transducer:
        from_hmms:
          - {process_name: mess3, process_params: {x: 0.05, a: 0.85}}
          - {process_name: mess3, process_params: {x: 0.15, a: 0.60}}
  device: ${device}

base_vocab_size: ???
vocab_size: ???
bos_token: ???
eos_token: null
