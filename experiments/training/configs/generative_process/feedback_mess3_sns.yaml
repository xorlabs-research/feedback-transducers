name: feedback_mess3_sns
# Role-swapped variant of feedback_sns_mess3: T = Mess3 (V=3, S=3),
# U = SNS (V=2, S=2, action-delayed -> S*X = 4).
#
# In the feedback-transducer feedback wiring:
#   T K = V_u = 2 -> 2 Mess3 variants stacked along input axis
#   U K = V_t = 3 -> 3 SNS variants stacked along input axis
#
# Same variant sets as feedback_sns_mess3.yaml (just role-swapped):
#   Mess3: (x, a) ∈ {(0.05, 0.85), (0.15, 0.60)}
#   SNS:   (p, q) ∈ {(0.30, 0.50), (0.50, 0.50), (0.70, 0.50)}
#
# Joint vocab: V_t * V_u = 3 * 2 = 6 (+ BOS = 7).  Same as
# feedback_sns_mess3.yaml.
# FWH dimensional bounds:
#   factored (LDH closed-form upper bound) ≤ (|R|−1) + (|S|·|X|−1) = 2 + 3 = 5
#   joint Kronecker                       ≤ |R|·|S|·|X| − 1 = 3·4 − 1 = 11
# This role assignment has the smaller LDH bound — U's latent (action-
# delayed SNS) is dim 4 vs T's Mess3 simplex dim 3.
instance:
  _target_: fwh_core.generative_processes.feedback_transducer.build_feedback_transducer_process_from_spec
  noise_epsilon: 0.0
  factors:
    - role: T
      transducer:
        from_hmms:
          - {process_name: mess3, process_params: {x: 0.05, a: 0.85}}
          - {process_name: mess3, process_params: {x: 0.15, a: 0.60}}
    - role: U
      transducer:
        from_hmms:
          - {process_name: sns, process_params: {p: 0.30, q: 0.50}}
          - {process_name: sns, process_params: {p: 0.50, q: 0.50}}
          - {process_name: sns, process_params: {p: 0.70, q: 0.50}}
  device: ${device}

base_vocab_size: ???
vocab_size: ???
bos_token: ???
eos_token: null
