name: telephone_mess3_n2
# Telephone with N=2 action-delayed mess3 agents (A=3) coupled through the
# memoryless deterministic router T; N-sweep sibling of telephone_mess3
# (N=3). Both agents use the first two kernel triples of telephone_mess3.
# Tuple encoding: joint vocab = 9^2 = 81 (support 3^2).
instance:
  _target_: fwh_core.generative_processes.feedback_transducer.build_telephone_loop
  noise_epsilon: 0.0
  action_size: 3
  agents:
    - transducer:
        from_hmms:
          - {process_name: mess3, process_params: {x: 0.05, a: 0.85}}
          - {process_name: mess3, process_params: {x: 0.10, a: 0.50}}
          - {process_name: mess3, process_params: {x: 0.15, a: 0.70}}
    - transducer:
        from_hmms:
          - {process_name: mess3, process_params: {x: 0.05, a: 0.60}}
          - {process_name: mess3, process_params: {x: 0.10, a: 0.50}}
          - {process_name: mess3, process_params: {x: 0.15, a: 0.70}}
  device: ${device}

base_vocab_size: ???
vocab_size: ???
bos_token: ???
eos_token: null
