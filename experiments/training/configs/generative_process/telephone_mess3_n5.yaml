name: telephone_mess3_n5
# Telephone with N=5 action-delayed mess3 agents (A=3) coupled through the
# memoryless deterministic router T; N-sweep sibling of telephone_mess3
# (N=3). Agents 1-3 use the same kernel triples as telephone_mess3; further
# agents extend the mixed-contrast design. Tuple encoding: joint vocab = 9^5 = 59049 (support 3^5).
instance:
  _target_: fwh_core.generative_processes.feedback_transducer.build_telephone_loop
  noise_epsilon: 0.0
  action_size: 3
  agents:
    - transducer:
        from_hmms:
          - {process_name: mess3, process_params: {x: 0.05, a: 0.85}}
          - {process_name: mess3, process_params: {x: 0.10, a: 0.50}}
          - {process_name: mess3, process_params: {x: 0.15, a: 0.70}}
    - transducer:
        from_hmms:
          - {process_name: mess3, process_params: {x: 0.05, a: 0.60}}
          - {process_name: mess3, process_params: {x: 0.10, a: 0.50}}
          - {process_name: mess3, process_params: {x: 0.15, a: 0.70}}
    - transducer:
        from_hmms:
          - {process_name: mess3, process_params: {x: 0.03, a: 0.80}}
          - {process_name: mess3, process_params: {x: 0.12, a: 0.55}}
          - {process_name: mess3, process_params: {x: 0.15, a: 0.65}}
    - transducer:
        from_hmms:
          - {process_name: mess3, process_params: {x: 0.06, a: 0.75}}
          - {process_name: mess3, process_params: {x: 0.09, a: 0.45}}
          - {process_name: mess3, process_params: {x: 0.14, a: 0.60}}
    - transducer:
        from_hmms:
          - {process_name: mess3, process_params: {x: 0.04, a: 0.70}}
          - {process_name: mess3, process_params: {x: 0.11, a: 0.65}}
          - {process_name: mess3, process_params: {x: 0.13, a: 0.55}}
  device: ${device}

