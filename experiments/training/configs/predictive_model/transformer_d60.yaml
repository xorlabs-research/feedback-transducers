name: hooked_transformer
# Half-width canonical: same depth as transformer_canonical (4 layers) but half
# the residual-stream width (d_model 60 vs 120). Attention and MLP are scaled to
# the narrower stream proportionally: 3 heads x d_head 20 = d_model 60, and
# d_mlp = 4*d_model = 240. ~4x fewer parameters than canonical.
instance:
  _target_: transformer_lens.HookedTransformer
  cfg:
    _target_: transformer_lens.HookedTransformerConfig
    d_model: 60
    d_head: 20
    n_heads: 3
    n_layers: 4
    n_ctx: 9
    d_mlp: 240
    d_vocab: ???
    act_fn: "relu"
    normalization_type: "LN"
    device: ${device}
    seed: ${weight_init_seed}

load_checkpoint_step: null
