defaults:
  - training: reproducibility
  - predictive_model: transformer_canonical
  - generative_process: cg_r3_full
  - metric_tracker@training_metric_tracker: full
  - metric_tracker@eval_metric_tracker: loss_only
  - activation_tracker: simple_tracker
  - logging: mlflow_logger
  - persistence: local_pytorch
  - optimizer: pytorch_adam
  - lr_scheduler: windowed_plateau
  - _self_

experiment_name: feedback_transducer
run_name: cg_r3_full_canonical
seed: 907
weight_init_seed: 957
# Per-seed data stream: data keys are fold_in(PRNGKey(seed), step), so each
# seed sees distinct process samples.
seed_data_stream: true
device: auto

tags:
  research_step: training
  retention: ephemeral
  strict: "true"

experiment_tags:
  project: feedback_transducer

visualization:
  every: 10000
  cev:
    enabled: true
    colorscale: Archival
    max_components: null
    show_rangeslider: true
  belief_regression:
    enabled: true
    max_samples: 10000

# Paper runs train for 50k steps.
training:
  num_steps: 50000
